name: QA CI/CD Pipeline - Azure AKS (OIDC)

on:
  push:
    branches: [ qa ]
  workflow_dispatch:

permissions:
  id-token: write   # Required for Azure OIDC authentication
  contents: read

jobs:
  test-and-lint:
    name: 🧪 QA Lint & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_flask_app/approach_4_eks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies & run tests
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov bandit pip-audit
          flake8 . --exclude=venv,uploads --count --select=E9,F63,F7,F82 --show-source
          DATABASE_URL="sqlite:///:memory:" pytest --verbose
          bandit -r . -x ./venv,./uploads,./test_app.py
          pip-audit -r requirements.txt

  build-and-deploy-qa:
    name: 🚀 Build, Push & Deploy to QA AKS
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure via OIDC (Zero Passwords)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_QA_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to QA ACR
        run: az acr login --name ${{ secrets.ACR_QA_NAME }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: python_flask_app/approach_4_eks
          push: true
          tags: ${{ secrets.ACR_QA_NAME }}.azurecr.io/python-transaction-flask-app:qa-${{ github.sha }}

      - name: Connect to QA AKS Cluster
        uses: azure/aks-set-context@v3
        with:
          resource-group: rg-flask-multicloud-qa
          cluster-name: flask-2fa-aks-qa
          admin: 'true'

      - name: Deploy to QA with Automated Rollback Trap
        run: |
          cd python_flask_app/approach_4_eks
          
          echo "📦 Deploying Postgres StatefulSet to QA..."
          kubectl apply -f postgres-deployment.yaml
          kubectl rollout status statefulset/postgres --timeout=180s

          echo "🚀 Deploying App Server to QA..."
          sed -i "s|image: guruhemanth/python-transaction-flask-app:.*|image: ${{ secrets.ACR_QA_NAME }}.azurecr.io/python-transaction-flask-app:qa-${{ github.sha }}|g" deployment.yaml
          kubectl apply -f deployment.yaml

          if ! kubectl rollout status deployment/flask-app-deployment --timeout=180s; then
            echo "❌ QA Rollout failed! Executing automated rollback..."
            kubectl rollout undo deployment/flask-app-deployment
            exit 1
          fi

          echo "✅ QA Deployment Successfully Verified!"
          kubectl get pods -o wide
          kubectl get svc
