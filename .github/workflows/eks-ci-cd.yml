name: Enterprise CI/CD & DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # Required for CodeQL / GHAS SARIF upload
  id-token: write        # Required for AWS OIDC authentication

jobs:
  # ── STAGE 1: Code Quality & Testing ─────────────────────────────────────────
  test-and-lint:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_flask_app/approach_4_eks
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'python_flask_app/approach_4_eks/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov bandit pip-audit

      - name: Run Flake8 Linter
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Pytest with Coverage
        run: |
          pytest --verbose --cov=. --cov-report=xml || true

  # ── STAGE 2: GitHub Advanced Security (GHAS) & SAST ─────────────────────────
  security-audit:
    name: 🛡️ GHAS & Security Scan
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL (GHAS SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r python_flask_app/approach_4_eks/requirements.txt || true

  # ── STAGE 3: Build & Container Security ────────────────────────────────────
  build-and-scan:
    name: 🐳 Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    needs: security-audit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Vulnerability Scan
        uses: docker/build-push-action@v5
        with:
          context: python_flask_app/approach_4_eks
          load: true
          tags: ${{ secrets.DOCKER_USERNAME }}/python-transaction-flask-app:${{ github.sha }}

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/python-transaction-flask-app:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Image to Registry
        uses: docker/build-push-action@v5
        with:
          context: python_flask_app/approach_4_eks
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/python-transaction-flask-app:latest
            ${{ secrets.DOCKER_USERNAME }}/python-transaction-flask-app:${{ github.sha }}

  # ── STAGE 4: Continuous Deployment to AWS EKS ──────────────────────────────
  deploy-eks:
    name: 🚀 Deploy to AWS EKS
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --region ap-south-1 --name flask-2fa-eks

      - name: Deploy Kubernetes Manifests
        run: |
          cd python_flask_app/approach_4_eks
          kubectl apply -f postgres-deployment.yaml
          kubectl apply -f deployment.yaml
          kubectl set image deployment/flask-transaction-app flask-transaction-app=${{ secrets.DOCKER_USERNAME }}/python-transaction-flask-app:${{ github.sha }}
          kubectl rollout status deployment/flask-transaction-app --timeout=120s
