apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  labels:
    app: flask-app
spec:
  replicas: 2 # Runs 2 copies of your application across worker nodes
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-container
        image: python-transaction-flask-app:v2.0
        imagePullPolicy: IfNotPresent # Uses locally loaded image in kind
        ports:
        - containerPort: 8090
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:Guru%40123@postgres-service:5432/my_flask_db"
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
spec:
  type: NodePort # Exposes the service externally on all nodes
  selector:
    app: flask-app
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
      nodePort: 30090 # Access via localhost:30090
