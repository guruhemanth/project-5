apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app-deployment
  labels:
    app: flask-app
spec:
  replicas: 1 # Single replica for t3.micro nodes
  strategy:
    type: Recreate # Kills old pod first to free ENI IP on t3.micro node before starting new pod
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask-container
        image: guruhemanth/python-transaction-flask-app:latest
        imagePullPolicy: Always # Uses locally loaded image in kind
        ports:
        - containerPort: 8090
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:Guru%40123@postgres-service:5432/my_flask_db"
        resources:
          requests:
            memory: "128Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: flask-app-service
spec:
  type: LoadBalancer # AWS Elastic Load Balancer for cloud access
  selector:
    app: flask-app
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
      nodePort: 30090 # Access via localhost:30090
