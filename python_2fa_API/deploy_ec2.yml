---
# ── Ansible Playbook: Deploy Flask App to EC2 ────────────────────────────────
# Deploys the Python 2FA Flask Docker image to an EC2 instance.
# Jenkins calls this after building the Docker image in Stage 5.
#
# Usage:
#   ansible-playbook -i inventory.ini deploy_ec2.yml \
#     -e "image_tag=v2.24" \
#     --private-key ~/.ssh/ec2-key.pem

- name: Deploy Python 2FA Flask App to EC2
  hosts: ec2
  become: yes
  vars:
    app_image: "python-transaction-flask-app"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest') }}"
    app_port: 8090
    container_name: "flask-2fa-app"
    db_url: "{{ db_url | default(lookup('env', 'DATABASE_URL')) | default('postgresql://postgres:GuruH123@flask-2fa-postgres.cx2gesqyit6u.ap-south-1.rds.amazonaws.com:5432/my_flask_db') }}"

  tasks:

    # ── Step 1: Install Docker on EC2 ────────────────────────────────────────
    - name: Update apt cache (Debian/Ubuntu)
      apt:
        update_cache: yes
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install Docker (Debian/Ubuntu)
      apt:
        name: docker.io
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Docker (RedHat/Amazon Linux)
      package:
        name: docker
        state: present
      when: ansible_os_family == "RedHat"

    - name: Start Docker via systemd (EC2 with systemd)
      systemd:
        name: docker
        state: started
        enabled: yes
      failed_when: false
      ignore_errors: yes

    - name: Start Docker directly if systemd not available (fallback)
      command: dockerd &
      failed_when: false
      ignore_errors: yes
      changed_when: false

    - name: Verify Docker is running
      command: docker info
      register: docker_info
      failed_when: docker_info.rc != 0
      changed_when: false

    # ── Step 2: Copy Docker image tar from Jenkins to EC2 ────────────────────
    - name: Create app directory on EC2
      file:
        path: /opt/flask-app
        state: directory
        mode: '0755'

    - name: Copy Docker image tar to EC2
      copy:
        src: "/tmp/{{ app_image }}-{{ image_tag }}.tar"
        dest: "/opt/flask-app/{{ app_image }}-{{ image_tag }}.tar"
        mode: '0644'

    # ── Step 3: Load Docker image into EC2 Docker ────────────────────────────
    - name: Load Docker image from tar
      command: "docker load -i /opt/flask-app/{{ app_image }}-{{ image_tag }}.tar"
      register: docker_load_output

    - name: Show docker load output
      debug:
        msg: "{{ docker_load_output.stdout }}"

    # ── Step 4: Stop, remove old container & free port 8090 ─────────────────
    - name: Force stop and remove existing container
      command: "docker rm -f {{ container_name }}"
      failed_when: false
      changed_when: false

    - name: Ensure port {{ app_port }} is freed (kill any leftover process)
      shell: "fuser -k {{ app_port }}/tcp || true"
      failed_when: false
      changed_when: false

    # ── Step 5: Run new container ─────────────────────────────────────────────
    - name: Run Flask app Docker container
      command: >
        docker run -d
        --name {{ container_name }}
        --restart unless-stopped
        -p {{ app_port }}:{{ app_port }}
        -e DATABASE_URL="{{ db_url }}"
        {{ app_image }}:{{ image_tag }}
      register: container_run

    - name: Show container ID
      debug:
        msg: "🚀 Container started with ID: {{ container_run.stdout }} and dburl is {{ db_url }}"

    # ── Step 6: Verify container is running ───────────────────────────────────
    - name: Wait for Flask app to be ready
      wait_for:
        host: localhost
        port: "{{ app_port }}"
        delay: 3
        timeout: 30

    - name: Verify container is running
      command: docker ps --filter "name={{ container_name }}" --format "{{ '{{' }}.Status{{ '}}' }}"
      register: container_status
      changed_when: false

    - name: Show container status
      debug:
        msg: "✅ Flask app is running | Status: {{ container_status.stdout }}"

    # ── Step 7: Cleanup old image tars ───────────────────────────────────────
    - name: Remove old image tar file from EC2
      file:
        path: "/opt/flask-app/{{ app_image }}-{{ image_tag }}.tar"
        state: absent

    - name: Deployment complete
      debug:
        msg: "🎉 Deployment successful! Flask app running at http://{{ ansible_host }}:{{ app_port }}"
