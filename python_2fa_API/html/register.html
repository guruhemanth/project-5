<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Account</title>

  <style>
    body {
      background: linear-gradient(to right, #74ebd5, #9face6);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .register-box {
      background: white;
      padding: 40px 60px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      width: 350px;
    }

    h2 {
      margin-top: 0;
      color: #4b6cb7;
      text-align: center;
    }

    input {
      display: block;
      width: 100%;
      margin: 15px 0;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background-color: #4b6cb7;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background-color: #3b5998;
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
      font-size: 0.9rem;
    }

    .login-link a {
      color: #4b6cb7;
      text-decoration: none;
      font-weight: bold;
    }

    #responseBox {
      display: none;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="register-box">
    <h2>Create Account</h2>
    <div id="responseBox"></div>

    <form id="registerForm">
      <input type="text" name="username" placeholder="Username" required />
      <input type="email" name="email" placeholder="Email Address" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Register</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="/login">Login here</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const responseBox = document.getElementById('responseBox');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();

      const data = {
        username: form.username.value,
        email: form.email.value,
        password: form.password.value
      };

      try {
        const response = await fetch('/api/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        responseBox.style.display = 'block';

        if (response.ok) {
          responseBox.style.background = '#d4edda';
          responseBox.style.color = '#155724';
          responseBox.innerHTML = `<b>Success!</b> Account created. Redirecting to login...`;
          setTimeout(() => {
            window.location.href = '/login';
          }, 1500);
        } else {
          responseBox.style.background = '#f8d7da';
          responseBox.style.color = '#721c24';
          responseBox.innerHTML = `<b>Error:</b> ${result.error || 'Registration failed'}`;
        }
      } catch (err) {
        console.error('Registration Error:', err);
        responseBox.style.display = 'block';
        responseBox.style.background = '#f8d7da';
        responseBox.style.color = '#721c24';
        responseBox.innerHTML = `<b>Error:</b> Network error.`;
      }
    });
  </script>

</body>
</html>
