---
- name: Provision All Dependencies and Requirements for Python 2FA API & CI/CD Infrastructure
  hosts: all
  become: yes
  vars:
    project_dir: "{{ playbook_dir }}"
    kind_version: "v0.20.0"
    kubectl_version: "v1.28.2"

  tasks:
    # ── 1. Debian / Ubuntu Package Installation ─────────────────────────────
    - name: Update apt cache and install system packages (Debian/Ubuntu)
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
          - python3-dev
          - gcc
          - g++
          - make
          - libpq-dev
          - curl
          - git
          - unzip
          - docker.io
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    # ── 2. RedHat / Fedora / CentOS Package Installation ────────────────────
    - name: Install system packages (RHEL/Fedora/CentOS)
      package:
        name:
          - python3
          - python3-pip
          - gcc
          - gcc-c++
          - make
          - postgresql-devel
          - curl
          - git
          - unzip
          - docker
        state: present
      when: ansible_os_family == "RedHat"

    # ── 3. Docker Daemon Management ─────────────────────────────────────────
    - name: Ensure Docker service is running and enabled on boot
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add target user to docker group
      user:
        name: "{{ ansible_user | default(ansible_env.USER) }}"
        groups: docker
        append: yes

    # ── 4. Install Kind Binary ──────────────────────────────────────────────
    - name: Check if Kind is installed
      command: kind --version
      register: kind_check
      failed_when: false
      changed_when: false

    - name: Download and install Kind binary
      get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: '0755'
      when: kind_check.rc != 0

    # ── 5. Install Kubectl Binary ───────────────────────────────────────────
    - name: Check if Kubectl is installed
      command: kubectl version --client
      register: kubectl_check
      failed_when: false
      changed_when: false

    - name: Download and install Kubectl binary
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'
      when: kubectl_check.rc != 0

    # ── 6. Virtual Environment & Python Requirements Setup ──────────────────
    - name: Create Python Virtual Environment (venv)
      command: "python3 -m venv {{ project_dir }}/venv"
      args:
        creates: "{{ project_dir }}/venv/bin/activate"
      become: no

    - name: Upgrade pip in virtualenv
      pip:
        name: pip
        state: latest
        virtualenv: "{{ project_dir }}/venv"
      become: no

    - name: Install Python dependencies from requirements.txt
      pip:
        requirements: "{{ project_dir }}/requirements.txt"
        virtualenv: "{{ project_dir }}/venv"
      become: no

    - name: Install testing and security tools (pytest, flake8, bandit, pip-audit)
      pip:
        name:
          - flake8
          - pytest
          - pytest-cov
          - bandit
          - pip-audit
        virtualenv: "{{ project_dir }}/venv"
      become: no

    # ── 7. Configure Kubeconfig Permissions ─────────────────────────────────
    - name: Ensure Jenkins kubeconfig directory exists if Jenkins is installed
      file:
        path: /var/jenkins_home/.kube
        state: directory
        owner: root
        mode: '0755'
      failed_when: false

    - name: Check if Kind cluster 'multi-node' is active
      command: kind get clusters
      register: clusters_check
      failed_when: false
      changed_when: false
      become: no

    - name: Export Kind kubeconfig to Jenkins home if cluster exists
      shell: "kind get kubeconfig --name multi-node > /var/jenkins_home/.kube/config"
      when: "'multi-node' in clusters_check.stdout"
      failed_when: false

    - name: Fix server IP in Jenkins kubeconfig for internal docker network access
      replace:
        path: /var/jenkins_home/.kube/config
        regexp: 'https://127.0.0.1:6443'
        replace: 'https://172.18.0.2:6443'
      failed_when: false
