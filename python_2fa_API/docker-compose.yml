services:
  # 1. PostgreSQL Database Service (Pull from official Docker Hub image)
  postgres:
    image: postgres:15-alpine
    container_name: python_transaction_postgres
    restart: always
    environment:
      POSTGRES_DB: my_flask_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Guru@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Flask Application Service (Built locally from Dockerfile)
  web:
    build: .
    image: python-transaction-flask-app:v1.0
    container_name: python_transaction_app
    restart: always
    ports:
      - "8090:8090"
    environment:
      DATABASE_URL: postgresql://postgres:Guru%40123@postgres:5432/my_flask_db
    depends_on:
      - postgres

volumes:
  postgres_data:
